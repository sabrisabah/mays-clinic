# Deploy from the repo root so both backend/ and frontend/ are in the image.
# Explicit startCommand avoids Railpack looking for manage.py at the root.
[build]
builder = "RAILPACK"

[deploy]
startCommand = "cd backend && python manage.py migrate --noinput && python manage.py collectstatic --noinput && python manage.py seed_doctor && python manage.py import_medications && python manage.py seed_foods && python manage.py seed_services && python manage.py backfill_current_weight && python manage.py seed_reminder_templates && gunicorn mays_clinic.wsgi:application --bind 0.0.0.0:$PORT --timeout 90"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
