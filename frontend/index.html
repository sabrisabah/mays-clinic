<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عيادة دكتورة ميس الربيعي للتغذية</title>
<link rel="stylesheet" href="css/style.css">
<style>
  html, body { height: 100%; margin: 0; }
  body {
    min-height: 100vh;
    background: linear-gradient(160deg, #2e6752 0%, #ba9837 55%, #f4f4f4 100%);
    background-attachment: fixed;
    display: flex; align-items: center; justify-content: center;
    padding: 32px 16px;
  }

  .neu-page { width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center; }

  .neu-brand {
    display: flex; align-items: center; justify-content: center;
    background: #ffffff; border-radius: 26px; padding: 14px 28px;
    margin-bottom: 24px; box-shadow: 0 10px 26px rgba(30,60,48,.30);
  }
  .neu-brand img { height: 130px; width: auto; display: block; }

  .neu-card {
    width: 100%;
    background: #f4f4f4;
    border-top: 5px solid #ba9837;
    border-radius: 32px;
    padding: 34px 30px 30px;
    box-shadow: 0 18px 40px rgba(30,60,48,.35);
  }

  .neu-tabs {
    display: flex; gap: 6px; background: rgba(6,42,32,.28); border-radius: 999px;
    padding: 4px; margin-bottom: 22px;
  }
  .neu-tabs button {
    flex: 1; border: none; background: transparent; color: rgba(234,255,246,.75);
    padding: 9px; border-radius: 999px; font-family: inherit; font-size: .85rem;
    font-weight: 600; cursor: pointer; transition: background .15s, color .15s;
  }
  .neu-tabs button.active { background: #0b3d2e; color: #fff; box-shadow: 0 2px 8px rgba(6,42,32,.4); }

  .neu-avatar {
    width: 82px; height: 82px; border-radius: 50%; background: #2e6752;
    display: flex; align-items: center; justify-content: center; margin: 0 auto 14px;
    box-shadow: 0 0 0 4px #ba9837, 0 8px 18px rgba(30,60,48,.35);
  }
  .neu-avatar svg { width: 38px; height: 38px; color: #f4f4f4; }

  .neu-title {
    text-align: center; color: #2e6752; font-size: 1.05rem; font-weight: 700;
    letter-spacing: 2px; margin: 0 0 24px;
  }

  .neu-field { position: relative; margin-bottom: 16px; }
  .neu-field svg {
    position: absolute; right: 18px; top: 50%; transform: translateY(-50%);
    width: 18px; height: 18px; color: #ba9837; pointer-events: none;
  }
  .neu-field input, .neu-field select {
    width: 100%; border: none; border-radius: 999px; padding: 14px 46px 14px 18px;
    background: #fff; color: #2e6752; font-size: .92rem; font-family: inherit;
    border: 1px solid #d9d9d9;
    box-sizing: border-box;
  }
  .neu-field input::placeholder { color: #8a9a93; }
  .neu-field input:focus, .neu-field select:focus { outline: none; border-color: #ba9837; box-shadow: 0 0 0 3px rgba(186,152,55,.35); }
  .neu-field select { appearance: none; -webkit-appearance: none; cursor: pointer; }
  .neu-field select option { color: #0b3d2e; }

  .neu-row-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
  .neu-row-3 .neu-field { margin-bottom: 0; }
  .neu-row-3 input, .neu-row-3 select { padding-right: 14px; font-size: .8rem; }
  .neu-row-3 svg { display: none; }

  .neu-optrow { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; font-size: .78rem; }
  .neu-optrow label { display: flex; align-items: center; gap: 6px; color: #2e6752; cursor: pointer; }
  .neu-optrow input[type=checkbox] { accent-color: #2e6752; }
  .neu-optrow a { color: #8a6d12; text-decoration: none; cursor: pointer; opacity: .9; }
  .neu-optrow a:hover { text-decoration: underline; }

  .neu-hint { font-size: .72rem; color: rgba(234,255,246,.65); margin: 4px 0 16px; line-height: 1.5; }

  .neu-mini-label { display: block; font-size: .72rem; color: rgba(234,255,246,.75); margin: -6px 4px 6px; }

  .neu-btn {
    display: block; width: 100%; border: none; border-radius: 999px; padding: 14px;
    background: #2e6752; color: #fff; font-family: inherit; font-size: .92rem; font-weight: 700;
    letter-spacing: 1px; cursor: pointer; box-shadow: 0 10px 20px rgba(46,103,82,.35);
    transition: background .15s, transform .1s;
  }
  .neu-btn:hover { background: #ba9837; }
  .neu-btn:active { transform: translateY(1px); }

  .msg {
    border-radius: 14px; padding: 10px 14px; font-size: .82rem; margin-bottom: 16px;
    background: #e3efe9; color: #2e6752; display: none;
  }
  .msg.error { background: #f8dede; color: #8a1c1c; }
  .msg.success { background: #e3efe9; color: #2e6752; }

  .neu-footnote { text-align: center; color: rgba(234,255,246,.75); font-size: .76rem; margin-top: 20px; line-height: 1.6; max-width: 340px; }
</style>
</head>
<body>
  <div class="neu-page">
    <div class="neu-brand">
      <img src="images/logo.png" alt="شعار عيادة دكتورة ميس الربيعي">
    </div>

    <div class="neu-card">

      <div class="neu-avatar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c1.3-3.8 4.3-5.8 7.5-5.8s6.2 2 7.5 5.8"/></svg>
      </div>
      <h1 class="neu-title" id="cardTitle">تسجيل الدخول</h1>

      <div id="msg" class="msg" style="display:none;"></div>

      <!-- LOGIN -->
      <form id="loginForm">
        <div class="neu-field">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6.5 3.5c1 2 1.8 3.6 1 4.8-.8 1.2-2 1.4-1.6 2.6.8 2.4 3.3 4.9 5.7 5.7 1.2.4 1.4-.8 2.6-1.6 1.2-.8 2.8 0 4.8 1v2.3c0 1-.8 1.8-1.8 1.7-6.4-.6-12-6.2-12.6-12.6-.1-1 .7-1.8 1.7-1.8h.2Z"/></svg>
          <input type="text" id="loginIdentifier" required placeholder="رقم الهاتف" autocomplete="username">
        </div>
        <div class="neu-field">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="10.5" width="14" height="9" rx="1.5"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg>
          <input type="password" id="loginPassword" required placeholder="كلمة المرور" inputmode="numeric" autocomplete="current-password">
        </div>
        <div class="neu-optrow">
          <label><input type="checkbox" id="rememberMe" checked> تذكرني</label>
        </div>
        <button type="submit" class="neu-btn">دخول</button>
      </form>

    </div>
  </div>

<script src="js/api.js"></script>
<script>
if (Auth.isLoggedIn()) {
  window.location.href = dashboardPathForRole(Auth.getRole());
}

const msgEl = document.getElementById("msg");

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  hideMsg(msgEl);
  const identifier = document.getElementById("loginIdentifier").value.trim();
  const password = document.getElementById("loginPassword").value;
  const remember = document.getElementById("rememberMe").checked;
  try {
    const data = await apiFetch("/api/auth/login", {
      method: "POST",
      body: JSON.stringify({ identifier, password }),
    });
    Auth.save(data, remember);
    window.location.href = dashboardPathForRole(data.role);
  } catch (err) {
    showMsg(msgEl, err.message, "error");
  }
});

</script>
</body>
</html>
