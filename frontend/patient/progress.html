<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متابعة التقدم — عيادة دكتورة ميس</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="topbar">
    <div class="brand"><img src="../images/logo.png" alt="شعار عيادة دكتورة ميس"> عيادة دكتورة ميس</div>
    <nav>
      <span class="user-chip" id="userChip">...</span>
      <button class="link" onclick="Auth.logout()">تسجيل الخروج</button>
    </nav>
  </div>

  <div class="container">
    <div class="tabs-nav">
      <a href="dashboard.html">الرئيسية</a>
      <a href="assessment.html">استمارة التقييم</a>
      <a href="plan.html">الخطة الغذائية</a>
      <a href="followup.html">ملف المتابعة</a>
      <a href="mounjaro.html">متابعة المونجارو</a>
      <a href="progress.html" class="active">متابعة التقدم</a>
    </div>

    <div class="card">
      <h3>🔹 مخطط الوزن</h3>
      <div id="chartWrap"></div>
    </div>

    <div class="card">
      <h3>🔹 سجل زيارات المتابعة</h3>
      <div id="tableWrap"></div>
    </div>
  </div>

<script src="../js/api.js"></script>
<script>
if (!requireRole("patient")) { throw new Error("redirect"); }
document.getElementById("userChip").textContent = Auth.getName();
const patientId = Auth.getPatientId();

function renderChart(entries) {
  const wrap = document.getElementById("chartWrap");
  if (entries.length < 2) {
    wrap.innerHTML = `<div class="empty-state">أضف الطبيب زيارتين على الأقل ليظهر المخطط.</div>`;
    return;
  }
  const w = 700, h = 220, pad = 30;
  const weights = entries.map(e => e.weight);
  const min = Math.min(...weights) - 2, max = Math.max(...weights) + 2;
  const points = entries.map((e, i) => {
    const x = pad + (i * (w - 2 * pad)) / (entries.length - 1);
    const y = h - pad - ((e.weight - min) / (max - min)) * (h - 2 * pad);
    return `${x},${y}`;
  });
  const circles = entries.map((e, i) => {
    const [x, y] = points[i].split(",");
    return `<circle cx="${x}" cy="${y}" r="4" fill="#1f7a5c"></circle>`;
  }).join("");
  wrap.innerHTML = `
    <svg viewBox="0 0 ${w} ${h}" style="width:100%; max-width:100%; height:auto;">
      <polyline fill="none" stroke="#1f7a5c" stroke-width="2.5" points="${points.join(' ')}"></polyline>
      ${circles}
    </svg>`;
}

function renderTable(entries) {
  const wrap = document.getElementById("tableWrap");
  if (!entries.length) {
    wrap.innerHTML = `<div class="empty-state">لا توجد زيارات متابعة مسجلة بعد.</div>`;
    return;
  }
  const rows = entries.slice().reverse().map(e => `
    <tr>
      <td>${fmtDate(e.date)}</td>
      <td>${e.weight}</td>
      <td>${e.bmi}</td>
      <td>${e.commitment ? `<span class="badge green">${e.commitment}</span>` : "-"}</td>
      <td>${e.notes || "-"}</td>
    </tr>`).join("");
  wrap.innerHTML = `
    <table>
      <thead><tr><th>التاريخ</th><th>الوزن</th><th>BMI</th><th>الالتزام</th><th>ملاحظات</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

async function load() {
  try {
    const entries = await apiFetch(`/api/patients/${patientId}/progress`);
    renderChart(entries);
    renderTable(entries);
  } catch (err) {
    document.getElementById("tableWrap").innerHTML = `<div class="msg error">${err.message}</div>`;
  }
}
load();
</script>
</body>
</html>
