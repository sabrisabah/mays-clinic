<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الخطة الغذائية — عيادة دكتورة ميس الربيعي</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="topbar">
    <div class="brand"><img src="../images/logo.png" alt="شعار عيادة دكتورة ميس الربيعي"> عيادة دكتورة ميس الربيعي</div>
    <nav>
      <span class="user-chip" id="userChip">...</span>
      <button class="link" onclick="Auth.logout()">تسجيل الخروج</button>
    </nav>
  </div>

  <div class="container">
    <div class="tabs-nav">
      <a href="dashboard.html">الرئيسية</a>
      <a href="assessment.html">استمارة التقييم</a>
      <a href="plan.html" class="active">الخطة الغذائية</a>
      <a href="mounjaro.html">متابعة المونجارو</a>
      <a href="followup.html">ملف المتابعة</a>
    </div>

    <div id="content"></div>
  </div>

<script src="../js/api.js"></script>
<script>
if (!requireRole("patient")) { throw new Error("redirect"); }
refreshUserChip("userChip", Auth.getName());
const patientId = Auth.getPatientId();

const PLAN_MEAL_TYPES = [["فطور", "فطور"], ["سناك1", "سناك 1"], ["غداء", "غداء"], ["سناك2", "سناك 2"], ["عشاء", "عشاء"]];
const PLAN_MEAL_ICON = { "فطور": "🌅", "سناك1": "🥪", "غداء": "🍽️", "سناك2": "🍎", "عشاء": "🌙" };
function planMealLabel(mealType) {
  return (PLAN_MEAL_TYPES.find(([v]) => v === mealType) || [mealType, mealType])[1];
}
function escapeHtml(s) {
  const div = document.createElement("div");
  div.textContent = s || "";
  return div.innerHTML;
}

let planActiveDay = 1;

function planSetActiveDay(day) {
  planActiveDay = day;
  document.querySelectorAll(".plan-day").forEach((el) => {
    el.classList.toggle("plan-day-hidden", Number(el.dataset.day) !== day);
  });
  document.querySelectorAll(".day-tab-btn").forEach((btn) => {
    btn.classList.toggle("active", Number(btn.dataset.day) === day);
  });
}

async function load() {
  const content = document.getElementById("content");
  try {
    // The API already restricts a patient to their own Active plan only.
    const plans = await apiFetch(`/api/patients/${patientId}/nutrition-plans`);
    const plan = plans.find((p) => p.status === "Active");
    if (!plan) {
      content.innerHTML = `<div class="card"><div class="empty-state">لم يقم الطبيب باعتماد خطة غذائية بعد. يرجى مراجعة الطبيب بعد إكمال استمارة التقييم.</div></div>`;
      return;
    }

    const allMeals = (plan.meals || []).slice().sort((a, b) => a.order - b.order);
    const dayNumbers = [...new Set(allMeals.map((m) => m.day_number || 1))].sort((a, b) => a - b);
    const isMultiDay = dayNumbers.length > 1;
    if (!dayNumbers.includes(planActiveDay)) planActiveDay = dayNumbers[0] || 1;

    const cycleNoteHtml = isMultiDay
      ? `<p style="color:var(--muted); font-size:.85rem; margin-bottom:14px;">🔁 هذه دورة من ${dayNumbers.length} أيام مختلفة — تتكرر بنفس الترتيب طوال مدة الخطة كاملة. اختاري يوماً لعرض وجباته، أو اطبعي الخطة لرؤية كل الأيام معاً.</p>` : "";

    const dayTabsHtml = isMultiDay ? `
      <div class="day-tabs-row">
        ${dayNumbers.map((day) => {
          const dayCalories = allMeals
            .filter((m) => (m.day_number || 1) === day)
            .reduce((sum, meal) => sum + (meal.items || []).filter((it) => it.patient_visible).reduce((s, it) => s + (it.calories || 0), 0), 0);
          return `<button type="button" class="day-tab-btn${day === planActiveDay ? " active" : ""}" data-day="${day}" onclick="planSetActiveDay(${day})">اليوم ${day} — ${Math.round(dayCalories)} سعرة</button>`;
        }).join("")}
      </div>` : "";

    const mealsHtml = dayNumbers.map((day) => {
      const dayMeals = allMeals.filter((m) => (m.day_number || 1) === day);
      const dayTitleHtml = isMultiDay
        ? `<div class="day-section-title"><span class="day-badge">اليوم ${day}</span></div>` : "";
      const dayMealsHtml = dayMeals.map((meal) => {
        const items = (meal.items || []).filter((it) => it.patient_visible);
        if (!items.length) return "";
        const subtotal = items.reduce((sum, it) => sum + (it.calories || 0), 0);
        const rows = items.map((it) => `
          <tr>
            <td>${escapeHtml(it.food_name)}</td>
            <td>${it.quantity} ${escapeHtml(it.unit || "")}${it.food_state ? " (" + escapeHtml(it.food_state) + ")" : ""}</td>
            <td>${it.calories} سعرة</td>
            <td class="col-alt">${escapeHtml(it.alternative_text || "-")}</td>
            <td class="col-note">${escapeHtml(it.instructions || "-")}</td>
          </tr>`).join("");
        return `
          <div class="meal-block">
            <div class="meal-block-header">
              <div class="meal-title">
                <span class="meal-icon">${PLAN_MEAL_ICON[meal.meal_type] || "🍴"}</span>
                <span>${planMealLabel(meal.meal_type)}</span>
                ${meal.time ? `<span class="meal-time">— ${meal.time}</span>` : ""}
              </div>
              <span class="badge green meal-total">${Math.round(subtotal)} سعرة</span>
            </div>
            <table>
              <thead><tr><th>الصنف</th><th>الكمية</th><th>السعرات</th><th>البديل المكافئ</th><th>تعليمات</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>`;
      }).join("");
      return `<div class="plan-day${day === planActiveDay ? "" : " plan-day-hidden"}" data-day="${day}">${dayTitleHtml}${dayMealsHtml}</div>`;
    }).join("");

    content.innerHTML = `
      <div class="card">
        <h3>🔹 الخطة الغذائية الحالية${plan.name ? " — " + escapeHtml(plan.name) : ""}</h3>
        <div class="stats-row">
          <div class="stat-card"><div class="value">${plan.calorie_target || 0}</div><div class="label">سعرة حرارية / يوم</div></div>
          <div class="stat-card"><div class="value">${plan.protein_grams || 0} غم</div><div class="label">بروتين</div></div>
          <div class="stat-card"><div class="value">${plan.carbs_grams || 0} غم</div><div class="label">كاربوهيدرات</div></div>
          <div class="stat-card"><div class="value">${plan.fat_grams || 0} غم</div><div class="label">دهون</div></div>
        </div>
        ${plan.start_date ? `<p style="color:var(--muted); font-size:.85rem;">تاريخ البدء: ${plan.start_date}${plan.duration_value ? ` — المدة: ${plan.duration_value} ${escapeHtml(plan.duration_unit || "")}` : ""}</p>` : ""}
      </div>

      <div class="card">
        <h3>🔹 جدول الوجبات اليومي</h3>
        ${cycleNoteHtml}
        ${dayTabsHtml}
        ${mealsHtml || `<div class="empty-state">لم يتم إضافة تفاصيل الوجبات بعد.</div>`}
      </div>

      ${plan.patient_notes ? `
      <div class="card">
        <h3>🔹 ملاحظات الطبيب</h3>
        <p style="white-space:pre-wrap; color:var(--text);">${escapeHtml(plan.patient_notes)}</p>
      </div>` : ""}

      <div class="btn-row">
        <button type="button" class="btn secondary" id="printPlanBtn">طباعة الخطة</button>
      </div>
      <p style="color:var(--muted); font-size:.8rem;">آخر تحديث: ${fmtDate(plan.updated_at)}</p>`;

    document.getElementById("printPlanBtn").addEventListener("click", () => window.print());
  } catch (err) {
    content.innerHTML = `<div class="msg error">${err.message}</div>`;
  }
}
load();
</script>
</body>
</html>
