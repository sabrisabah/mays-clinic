<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ملف المتابعة — عيادة دكتورة ميس الربيعي</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="topbar">
    <div class="brand"><img src="../images/logo.png" alt="شعار عيادة دكتورة ميس الربيعي"> عيادة دكتورة ميس الربيعي</div>
    <nav>
      <span class="user-chip" id="userChip">...</span>
      <button class="link" onclick="Auth.logout()">تسجيل الخروج</button>
    </nav>
  </div>

  <div class="container">
    <div class="tabs-nav">
      <a href="dashboard.html">الرئيسية</a>
      <a href="assessment.html">استمارة التقييم</a>
      <a href="plan.html">الخطة الغذائية</a>
      <a href="followup.html" class="active">ملف المتابعة</a>
    </div>

    <div id="content"></div>
  </div>

<script src="../js/api.js"></script>
<script>
if (!requireRole("patient")) { throw new Error("redirect"); }
renderUserChip("userChip", Auth.getName());
const patientId = Auth.getPatientId();

function escapeHtml(s) {
  const div = document.createElement("div");
  div.textContent = s || "";
  return div.innerHTML;
}

async function load() {
  const content = document.getElementById("content");
  try {
    const f = await apiFetch(`/api/patients/${patientId}/followup`);
    const labResults = f.lab_results || {};
    const labEntries = Object.entries(labResults).filter(([, v]) => v !== null && v !== undefined && v !== 0);
    const injections = f.treatment_injections || [];
    const medications = f.treatment_medications || "";
    const fatBurningSessions = !!f.treatment_fat_burning_sessions;
    const hasTreatment = injections.length || medications || fatBurningSessions;
    const purpose = f.followup_purpose || [];

    const hasAnything = labEntries.length || hasTreatment || f.followup_interval_value || purpose.length;

    if (!hasAnything) {
      content.innerHTML = `<div class="card"><div class="empty-state">لم يقم الطبيب بتعبئة ملف المتابعة بعد.</div></div>`;
      return;
    }

    const labRows = labEntries.length
      ? `<table><thead><tr><th>التحليل</th><th>القيمة</th></tr></thead><tbody>
          ${labEntries.map(([name, val]) => `<tr><td>${escapeHtml(name)}</td><td>${val}</td></tr>`).join("")}
        </tbody></table>`
      : `<div class="empty-state">لا توجد نتائج تحاليل مسجلة بعد.</div>`;

    const treatmentBadges = [
      ...injections.map((t) => `<span class="badge green">${escapeHtml(t)}</span>`),
      fatBurningSessions ? `<span class="badge green">جلسات تكسير الشحم</span>` : "",
    ].filter(Boolean);

    content.innerHTML = `
      <div class="card">
        <h3>🔹 التحاليل</h3>
        ${labRows}
      </div>

      <div class="card">
        <h3>🔹 العلاج أو الوصفة الطبية</h3>
        <p style="margin:0 0 8px; color:var(--muted); font-size:.85rem;">الإبر</p>
        <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;">
          ${treatmentBadges.length ? treatmentBadges.join(" ") : `<span class="badge gray">لا يوجد</span>`}
        </div>
        <p style="margin:0 0 8px; color:var(--muted); font-size:.85rem;">الأدوية والمكملات الغذائية</p>
        <p style="white-space:pre-wrap; color:var(--text); margin:0;">${medications ? escapeHtml(medications) : "لا يوجد"}</p>
      </div>

      <div class="card">
        <h3>🔹 موعد المتابعة القادم</h3>
        <p>${f.followup_interval_value ? `بعد ${f.followup_interval_value} ${f.followup_interval_unit || ""}` : "لم يُحدَّد بعد"}</p>
        ${purpose.length ? `
        <p style="margin:0 0 8px; color:var(--muted); font-size:.85rem;">الغرض من المتابعة</p>
        <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px;">
          ${purpose.map((v) => `<span class="badge green">${escapeHtml(v)}</span>`).join("")}
        </div>` : ""}
        <p style="color:var(--muted); font-size:.8rem;">آخر تحديث: ${fmtDate(f.updated_at)}</p>
      </div>`;
  } catch (err) {
    content.innerHTML = `<div class="msg error">${err.message}</div>`;
  }
}
load();
</script>
</body>
</html>
