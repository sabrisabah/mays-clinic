<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متابعة المونجارو — عيادة دكتورة ميس</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="topbar">
    <div class="brand"><img src="../images/logo.png" alt="شعار عيادة دكتورة ميس"> عيادة دكتورة ميس</div>
    <nav>
      <span class="user-chip" id="userChip">...</span>
      <button class="link" onclick="Auth.logout()">تسجيل الخروج</button>
    </nav>
  </div>

  <div class="container">
    <div class="tabs-nav">
      <a href="dashboard.html">الرئيسية</a>
      <a href="assessment.html">استمارة التقييم</a>
      <a href="plan.html">الخطة الغذائية</a>
      <a href="followup.html">ملف المتابعة</a>
      <a href="mounjaro.html" class="active">متابعة المونجارو</a>
      <a href="progress.html">متابعة التقدم</a>
    </div>

    <div class="card">
      <h3>🔹 ملخص المتابعة</h3>
      <div id="summaryWrap" style="display:flex; gap:10px; flex-wrap:wrap;"></div>
    </div>

    <div class="card">
      <h3>🔹 مخطط الوزن مع الجرعات</h3>
      <div id="chartWrap"></div>
    </div>

    <div class="card">
      <h3>🔹 سجل الجرعات</h3>
      <div id="tableWrap"></div>
    </div>
  </div>

<script src="../js/api.js"></script>
<script>
if (!requireRole("patient")) { throw new Error("redirect"); }
document.getElementById("userChip").textContent = Auth.getName();
const patientId = Auth.getPatientId();

function escapeHtml(s) {
  const div = document.createElement("div");
  div.textContent = s || "";
  return div.innerHTML;
}

function renderChart(entries) {
  const wrap = document.getElementById("chartWrap");
  if (entries.length < 2) {
    wrap.innerHTML = `<div class="empty-state">تحتاج زيارتين على الأقل ليظهر المخطط.</div>`;
    return;
  }
  const w = 700, h = 220, pad = 30;
  const weights = entries.map(e => e.weight);
  const min = Math.min(...weights) - 2, max = Math.max(...weights) + 2;
  const points = entries.map((e, i) => {
    const x = pad + (i * (w - 2 * pad)) / (entries.length - 1);
    const y = h - pad - ((e.weight - min) / (max - min)) * (h - 2 * pad);
    return `${x},${y}`;
  });
  const circles = entries.map((e, i) => {
    const [x, y] = points[i].split(",");
    return `<circle cx="${x}" cy="${y}" r="4" fill="#1f7a5c"></circle>`;
  }).join("");
  wrap.innerHTML = `
    <svg viewBox="0 0 ${w} ${h}" style="width:100%; max-width:100%; height:auto;">
      <polyline fill="none" stroke="#1f7a5c" stroke-width="2.5" points="${points.join(' ')}"></polyline>
      ${circles}
    </svg>`;
}

function renderSummary(entries, targetWeight) {
  const wrap = document.getElementById("summaryWrap");
  const cards = [];
  const latest = entries.length ? entries[entries.length - 1] : null;
  if (latest) {
    cards.push(`<span class="badge green">آخر وزن مسجّل: ${latest.weight} كغم</span>`);
    cards.push(`<span class="badge green">آخر جرعة: ${latest.dose_mg} ملغم</span>`);
  }
  if (targetWeight) {
    cards.push(`<span class="badge gray">الوزن المستهدف: ${targetWeight} كغم</span>`);
    if (latest) {
      const remaining = Math.max(latest.weight - targetWeight, 0).toFixed(1);
      cards.push(remaining > 0
        ? `<span class="badge orange">المتبقي للوصول للهدف: ${remaining} كغم</span>`
        : `<span class="badge green">تم الوصول للوزن المستهدف 🎉</span>`);
    }
  }
  wrap.innerHTML = cards.length ? cards.join("") : `<span class="badge gray">لا توجد بيانات كافية بعد</span>`;
}

function renderTable(entries) {
  const wrap = document.getElementById("tableWrap");
  if (!entries.length) {
    wrap.innerHTML = `<div class="empty-state">لم يبدأ الطبيب بتسجيل جرعات المونجارو بعد.</div>`;
    return;
  }
  const rows = entries.slice().reverse().map((e, idx) => {
    const orderNum = entries.length - idx;
    return `
    <tr>
      <td>${fmtDate(e.date)}</td>
      <td>الوزن${orderNum}: ${e.weight} كغم</td>
      <td>الجرعة${orderNum}: ${e.dose_mg} ملغم</td>
      <td>${escapeHtml(e.notes) || "-"}</td>
    </tr>`;
  }).join("");
  wrap.innerHTML = `
    <table>
      <thead><tr><th>التاريخ</th><th>الوزن</th><th>الجرعة</th><th>ملاحظات</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

async function load() {
  try {
    const entries = await apiFetch(`/api/patients/${patientId}/mounjaro`);
    const assessment = await apiFetch(`/api/patients/${patientId}/assessment`);
    renderSummary(entries, assessment.target_weight);
    renderChart(entries);
    renderTable(entries);
  } catch (err) {
    document.getElementById("tableWrap").innerHTML = `<div class="msg error">${err.message}</div>`;
  }
}
load();
</script>
</body>
</html>
