<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الطبيب — عيادة دكتورة ميس الربيعي</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  .actions-cell { display: flex; flex-wrap: nowrap; gap: 6px; white-space: nowrap; }
  .actions-cell .btn { padding: 6px 9px; font-size: .78rem; }
  #tableWrap { overflow-x: auto; }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand"><img src="../images/logo.png" alt="شعار عيادة دكتورة ميس الربيعي"> عيادة دكتورة ميس الربيعي — واجهة الطبيب</div>
    <nav>
      <span class="user-chip" id="userChip">...</span>
      <button class="link" onclick="Auth.logout()">تسجيل الخروج</button>
    </nav>
  </div>

  <div class="container">
    <div class="card" style="display:flex; gap:10px; flex-wrap:wrap;">
      <a href="summary.html" class="btn small secondary">📊 ملخص المعلومات</a>
      <a href="invoices.html" class="btn small secondary">🧾 الفواتير</a>
      <a href="services.html" class="btn small secondary">💊 دليل الخدمات</a>
      <a href="reports.html" class="btn small secondary">📈 التقارير المالية</a>
      <a href="../reminders/index.html" class="btn small secondary">📨 تذكيرات WhatsApp</a>
    </div>

    <div class="card">
      <h2>قائمة المراجعين</h2>
      <div class="search-row">
        <input type="text" id="searchBox" placeholder="ابحث بالاسم، رقم الملف، أو الهاتف...">
        <button class="btn secondary" onclick="load()">بحث</button>
      </div>
      <div id="tableWrap"></div>
      <p style="color:var(--muted); font-size:.85rem; margin-top:10px;">
        لإضافة مريض جديد، اطلب منه إنشاء حساب "مريض" من صفحة تسجيل الدخول — سيظهر تلقائياً في هذه القائمة.
      </p>
    </div>
  </div>

<script src="../js/api.js"></script>
<script>
if (!requireRole("doctor")) { throw new Error("redirect"); }
refreshUserChip("userChip", "د. " + Auth.getName());

async function load() {
  const search = document.getElementById("searchBox").value.trim();
  const wrap = document.getElementById("tableWrap");
  try {
    const qs = search ? `?search=${encodeURIComponent(search)}` : "";
    const patients = await apiFetch(`/api/patients${qs}`);

    if (!patients.length) {
      wrap.innerHTML = `<div class="empty-state">لا يوجد مراجعون بعد.</div>`;
      return;
    }
    const rows = patients.map(p => `
      <tr style="cursor:pointer;" onclick="location.href='patient.html?id=${p.patient_id}'">
        <td>${p.file_number}</td>
        <td>${p.full_name}</td>
        <td>${p.age || "-"} / ${p.gender || "-"}</td>
        <td>${p.phone || "-"}</td>
        <td>${p.latest_weight || "-"}</td>
        <td>${p.latest_bmi ? `<span class="badge ${bmiBadgeClass(bmiClassOf(p.latest_bmi))}">${p.latest_bmi}</span>` : "-"}</td>
        <td>${fmtDate(p.last_visit)}</td>
        <td>
          <div class="actions-cell">
            <a class="btn small secondary" href="patient.html?id=${p.patient_id}">فتح الملف</a>
            <button type="button" class="btn small danger" onclick="deletePatient(event, ${p.patient_id}, '${escapeHtml(p.full_name)}', '${escapeHtml(p.file_number)}')">🗑 حذف</button>
          </div>
        </td>
      </tr>`).join("");
    wrap.innerHTML = `
      <table>
        <thead><tr><th>رقم الملف</th><th>الاسم</th><th>العمر/الجنس</th><th>الهاتف</th><th>الوزن</th><th>BMI</th><th>آخر زيارة</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  } catch (err) {
    wrap.innerHTML = `<div class="msg error">${err.message}</div>`;
  }
}
function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
// Doctor-only, permanent, irreversible — deletes the patient's entire file
// (clinical + billing history). Backend blocks it if the patient has
// invoices on file (financial records are never silently destroyed) and
// returns a clear error, which we just surface as-is.
async function deletePatient(event, patientId, fullName, fileNumber) {
  event.stopPropagation(); // don't also trigger the row's "open file" navigation
  const sure = confirm(
    `تحذير: هذا سيحذف ملف المريض "${fullName}" (${fileNumber}) نهائياً — ` +
    `الاستمارة، الجرعات، الوصفات، الخطط الغذائية، الملاحظات، وكل السجل الطبي. ` +
    `هذا الإجراء لا يمكن التراجع عنه.\n\nهل أنتِ متأكدة من الحذف؟`
  );
  if (!sure) return;
  try {
    await apiFetch(`/api/patients/${patientId}`, { method: "DELETE" });
    load();
  } catch (err) {
    alert(err.message);
  }
}
function bmiClassOf(bmi) {
  if (!bmi) return "";
  if (bmi < 18.5) return "نقص الوزن";
  if (bmi < 25) return "وزن طبيعي";
  if (bmi < 30) return "زيادة الوزن";
  if (bmi < 35) return "السمنة – الدرجة الأولى";
  if (bmi < 40) return "السمنة – الدرجة الثانية";
  return "السمنة – الدرجة الثالثة";
}
document.getElementById("searchBox").addEventListener("keydown", (e) => { if (e.key === "Enter") load(); });
load();
</script>
</body>
</html>
